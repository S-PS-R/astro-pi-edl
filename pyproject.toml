[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "edl-sense-hat-emulator"
version = "0.1.0"
description = "A Python Sense HAT sensor emulator with a live Tkinter GUI"
readme = "src/sense_hat_emulator/README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["sense_hat_emulator*"]
